# Railway config-as-code. The whole repo is deployed so that taste/ ships
# alongside the server — the context tool reads taste/*.md at runtime.
#
# MIGAKI_ROOT is NOT set here: railway.toml has no variables section.
# Set it on the service (dashboard or CLI) to /app.

[build]
builder = "RAILPACK"
buildCommand = "cd mcp-server && npm install && npm run build"
# Rebuild on server changes and on taste updates — the weekly taste PRs must
# reach the running service, and taste/*.md is read from the deployed image.
watchPatterns = ["mcp-server/**", "taste/**", "railway.toml", "package.json"]

[deploy]
startCommand = "cd mcp-server && npm start"
healthcheckPath = "/health"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
